[package]
name = "craft-appmenu"
description = "Canonical AppMenu (dbusmenu) global-menu exporter: publishes an application menu over D-Bus and registers X11 windows with the menu registrar. Shared by the Crafting Apps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Standalone: no workspace/repository dependencies, so every Crafting App can take this
# crate as-is. The D-Bus (zbus) and X11 (x11rb) bits are Linux/BSD only; other targets
# build the pure-data model plus stubs that fail gracefully (never "unsupported", never
# panic). External deps are pinned exactly (review the diff before bumping) — the same
# policy every Crafting App applies to its dependencies.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
zbus = "=5.19.0"
# Same zvariant zbus 5.19 pulls (`^5.14`); used directly for wire values and signatures.
zvariant = "=5.15.0"
serde = { version = "1", features = ["derive", "rc"] }
# Signal emission from the synchronous update path needs a tiny block_on driver.
futures-lite = { version = "=2.6.1", default-features = false, features = ["std"] }
# Same crate and pin the apps already pull for XInput2; no extra code size.
x11rb = { version = "=0.13.2", default-features = false }

[dependencies]
log = "0.4"
thiserror = "2"

# The workspace lints give the never-crash standard: `[lints] workspace = true` keeps the
# rust lints (`unsafe_code = "forbid"`) and adds nothing else — the deny list lives in the
# `#![deny(...)]` attribute in `lib.rs`. A crate-local `[lints.clippy]` would *replace* the
# workspace's lint set instead of extending it, which is how `unsafe_code` was lost.
[lints]
workspace = true
